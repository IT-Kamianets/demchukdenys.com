<div
	#viewerContainer
	class="model-viewer-box relative rounded-2xl overflow-hidden bg-white dark:bg-dark-light shadow-sm aspect-[16/9] lg:aspect-[21/9]"
>
	<div #viewer class="absolute inset-0"></div>

	<button
		type="button"
		(click)="toggleFullscreen()"
		class="absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-full bg-dark/60 hover:bg-dark/80 text-white transition-colors backdrop-blur-sm"
		[attr.aria-label]="isFullscreen() ? 'Вийти з повноекранного режиму' : 'На весь екран'"
	>
		@if (!isFullscreen()) {
			<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"
				/>
			</svg>
		} @else {
			<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					d="M9 3v4a1 1 0 01-1 1H4M20 8h-4a1 1 0 01-1-1V3m1 14h4M3 16h4a1 1 0 011 1v4m6-5h4a1 1 0 011 1v4"
				/>
			</svg>
		}
	</button>

	@if (loading()) {
		<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
			<div class="w-10 h-10 border-4 border-beige/30 border-t-beige rounded-full animate-spin"></div>
		</div>
	} @else if (loadError()) {
		<div class="absolute inset-0 flex items-center justify-center px-6 text-center">
			<p class="text-red-400">Не вдалося завантажити модель.</p>
		</div>
	}
</div>

<header
	class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
	[class]="scrolled ? 'bg-dark/95 backdrop-blur-md shadow-lg shadow-black/20' : 'bg-dark'"
>
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="relative flex items-center justify-between h-14 lg:h-20">
			<!-- Logo -->
			<a routerLink="/" class="hover:opacity-80 transition-opacity max-sm:mt-2">
				<img src="logo.png" alt="Demchuk Denys" class="h-8 lg:h-10" />
			</a>

			<!-- Desktop Navigation -->
			<nav class="hidden lg:flex items-center space-x-8">
				<a
					routerLink="/articles"
					class="text-sm uppercase tracking-widest text-gray-300 hover:text-beige transition-colors"
					routerLinkActive="text-beige"
					>Новини</a
				>
				<a
					routerLink="/portfolios"
					class="text-sm uppercase tracking-widest text-gray-300 hover:text-beige transition-colors"
					routerLinkActive="text-beige"
					>Роботи</a
				>
				<a
					routerLink="/services"
					class="text-sm uppercase tracking-widest text-gray-300 hover:text-beige transition-colors"
					routerLinkActive="text-beige"
					>Послуги</a
				>
			</nav>

			<!-- Desktop Social / Contact -->
			<div class="hidden lg:flex items-center space-x-4">
				<a
					[href]="telegramUrl"
					target="_blank"
					rel="noopener"
					class="hover:opacity-70 transition-opacity"
				>
					<img src="img/social/1.svg" alt="Telegram" class="w-5 h-5 invert" />
				</a>
				<a [href]="phoneHref" class="hover:opacity-70 transition-opacity">
					<img src="img/social/2.svg" alt="Phone" class="w-5 h-5 invert" />
				</a>
				<a
					[href]="facebookUrl"
					target="_blank"
					rel="noopener"
					class="hover:opacity-70 transition-opacity"
				>
					<img src="img/social/3.svg" alt="Facebook" class="w-5 h-5 invert" />
				</a>
				<a
					[href]="instagramUrl"
					target="_blank"
					rel="noopener"
					class="hover:opacity-70 transition-opacity"
				>
					<img src="img/social/4.svg" alt="Instagram" class="w-5 h-5 invert" />
				</a>
				<div class="border-l border-gray-700 pl-4 ml-2">
					<app-theme-toggle />
				</div>
			</div>

			<!-- Mobile: Nav centered -->
			<nav
				class="lg:hidden absolute inset-0 flex items-center justify-center gap-3 sm:gap-4 pointer-events-none max-sm:mt-7"
			>
				<a
					routerLink="/articles"
					class="text-xs uppercase tracking-wider text-gray-300 hover:text-beige transition-colors pointer-events-auto"
					routerLinkActive="text-beige"
					>Новини</a
				>
				<a
					routerLink="/portfolios"
					class="text-xs uppercase tracking-wider text-gray-300 hover:text-beige transition-colors pointer-events-auto"
					routerLinkActive="text-beige"
					>Роботи</a
				>
				<a
					routerLink="/services"
					class="text-xs uppercase tracking-wider text-gray-300 hover:text-beige transition-colors pointer-events-auto"
					routerLinkActive="text-beige"
					>Послуги</a
				>
			</nav>

			<!-- Mobile: Theme toggle -->
			<div class="lg:hidden self-center">
				<app-theme-toggle />
			</div>
		</div>
	</div>
</header>

<!-- Spacer for fixed header -->
<div class="h-14 lg:h-20"></div>

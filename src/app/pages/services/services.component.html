<section class="bg-warm-white dark:bg-dark min-h-screen">
	<!-- Page header -->
	<div class="bg-dark py-16 lg:py-20 relative overflow-hidden">
		<div
			class="absolute inset-0 opacity-10"
			style="
				background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%23d3c9b7&quot; fill-opacity=&quot;0.3&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
			"
		></div>
		<div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
			<span
				class="text-xs uppercase tracking-widest text-beige font-semibold mb-3 block"
				translate="Що ми робимо"
			></span>
			<h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white mb-4" translate="Наші послуги"></h1>
			<p
				class="text-gray-400 max-w-2xl mx-auto"
				translate="Повний цикл створення меблів - від першої ідеї до встановлення у вашому домі."
			></p>
		</div>
	</div>

	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16">
		<div class="space-y-12">
			@for (service of services; track service.title; let i = $index) {
				<div
					class="bg-white dark:bg-dark-light rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300"
				>
					<div
						class="grid grid-cols-1 lg:grid-cols-2"
						[class]="i % 2 === 1 ? 'lg:grid-flow-col-dense' : ''"
					>
						<div
							class="aspect-[16/10] lg:aspect-auto lg:min-h-[400px] overflow-hidden"
							[class]="i % 2 === 1 ? 'lg:col-start-2' : ''"
						>
							<img
								[src]="service.image"
								[alt]="service.title"
								width="1600"
								height="1000"
								loading="lazy"
								class="w-full h-full object-cover"
							/>
						</div>
						<div class="p-6 sm:p-8 lg:p-12 flex flex-col justify-center">
							<span
								class="text-xs uppercase tracking-widest text-beige-dark dark:text-beige font-semibold mb-3"
								><span translate="Послуга"></span> {{ i + 1 }}</span
							>
							<h2
								class="text-2xl lg:text-3xl font-bold text-dark dark:text-white mb-4"
								[translate]="service.title"
							></h2>
							<div class="w-12 h-1 bg-beige mb-6"></div>
							<p
								class="text-gray-500 dark:text-gray-400 leading-relaxed mb-8"
								[translate]="service.description"
							></p>
							<h4
								class="text-xs uppercase tracking-widest text-dark dark:text-white font-semibold mb-4"
								translate="Що входить:"
							></h4>
							<ul class="space-y-3">
								@for (item of service.includes; track item) {
									<li
										class="flex items-start text-gray-600 dark:text-gray-300 text-sm"
									>
										<div
											class="w-6 h-6 bg-beige/20 rounded-md flex items-center justify-center mr-3 flex-shrink-0 mt-0.5"
										>
											<svg
												class="w-3.5 h-3.5 text-beige-dark"
												fill="none"
												stroke="currentColor"
												stroke-width="2.5"
												viewBox="0 0 24 24"
											>
												<path
													stroke-linecap="round"
													stroke-linejoin="round"
													d="M4.5 12.75l6 6 9-13.5"
												/>
											</svg>
										</div>
										<span [translate]="item"></span>
									</li>
								}
							</ul>
						</div>
					</div>
				</div>
			}
		</div>
	</div>
</section>

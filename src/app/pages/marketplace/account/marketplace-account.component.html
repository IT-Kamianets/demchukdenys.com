<section class="bg-warm-white dark:bg-dark min-h-screen">
	<div class="bg-dark py-16 lg:py-20">
		<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
			<nav class="text-sm text-gray-400 mb-4">
				<a routerLink="/" class="hover:text-beige transition-colors">Головна</a>
				<span class="mx-2">/</span>
				<span class="text-white">Особистий кабінет</span>
			</nav>
			<span class="text-xs uppercase tracking-widest text-beige font-semibold mb-3 block">Кабінет</span>
			<h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white">{{ customerName }}</h1>
		</div>
	</div>

	<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16">
		<h2 class="text-sm uppercase tracking-widest text-beige-dark dark:text-beige font-semibold mb-4">
			Історія замовлень
		</h2>

		<div class="bg-white dark:bg-dark-light rounded-2xl shadow-sm divide-y divide-gray-100 dark:divide-gray-800">
			@for (order of orders; track order.id) {
				<a
					[routerLink]="['/order', order.id]"
					class="flex items-center justify-between p-5 sm:p-6 hover:bg-warm-white dark:hover:bg-dark transition-colors"
				>
					<div>
						<p class="text-dark dark:text-white font-semibold">{{ order.id }}</p>
						<p class="text-gray-500 dark:text-gray-400 text-sm">{{ order.date }} · {{ order.status }}</p>
					</div>
					<p class="text-dark dark:text-white font-bold">{{ order.total }} грн</p>
				</a>
			}
		</div>
	</div>
</section>

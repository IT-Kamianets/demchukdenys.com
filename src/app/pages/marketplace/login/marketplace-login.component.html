<section class="bg-warm-white dark:bg-dark min-h-screen flex items-center justify-center px-4">
	<form
		(ngSubmit)="onSubmit()"
		class="w-full max-w-sm bg-white dark:bg-dark-light rounded-2xl p-6 sm:p-8 shadow-sm space-y-5"
	>
		<h1 class="text-2xl font-bold text-dark dark:text-white text-center mb-2">Вхід для адміністратора</h1>

		<div>
			<label class="block text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider font-semibold mb-2"
				>Email</label
			>
			<input
				type="email"
				[(ngModel)]="email"
				name="email"
				required
				autocomplete="username"
				autofocus
				class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent px-4 py-3 text-dark dark:text-white outline-none focus:ring-2 focus:ring-beige"
			/>
		</div>

		<div>
			<label class="block text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider font-semibold mb-2"
				>Пароль</label
			>
			<input
				type="password"
				[(ngModel)]="password"
				name="password"
				required
				autocomplete="current-password"
				class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent px-4 py-3 text-dark dark:text-white outline-none focus:ring-2 focus:ring-beige"
			/>
		</div>

		@if (error) {
			<p class="text-sm text-red-500">{{ error }}</p>
		}

		<button
			type="submit"
			[disabled]="loading || !email.trim() || !password.trim()"
			class="w-full px-6 py-3.5 bg-dark dark:bg-beige text-white dark:text-dark font-semibold rounded-xl hover:bg-dark-light dark:hover:bg-beige-light transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
		>
			{{ loading ? 'Вхід...' : 'Увійти' }}
		</button>
	</form>
</section>
